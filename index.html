<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff6f2">
  <meta name="description" content="Undangan pernikahan Yhola & Ardan — 22 November 2026.">
  <title>Yhola & Ardan — 22 November 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page" id="scene">
    <img class="background" src="assets/background-layered.png" alt="Ilustrasi undangan Yhola dan Ardan">

    <!-- The artwork is kept fixed. Only the label text gently floats. -->
    <button class="floating-label label-gallery" data-modal="galleryModal" aria-label="Buka Gallery">
      <span class="pink-aura"></span><span class="spark spark-a">✦</span><span class="spark spark-b">✧</span>
      <img src="assets/text-gallery-button.png" alt="Gallery">
    </button>

    <button class="floating-label label-about" data-modal="aboutModal" aria-label="Buka About Us">
      <span class="pink-aura"></span><span class="spark spark-a">✦</span><span class="spark spark-b">✧</span>
      <img src="assets/text-about-us.png" alt="About Us">
    </button>

    <button class="floating-label label-rsvp" data-modal="rsvpModal" aria-label="Buka RSVP">
      <span class="pink-aura"></span><span class="spark spark-a">✦</span><span class="spark spark-b">✧</span>
      <span class="rsvp-text">RSVP</span>
    </button>

    <button class="floating-label label-date" data-modal="dateModal" aria-label="Buka Date & Venue">
      <span class="pink-aura"></span><span class="spark spark-a">✦</span><span class="spark spark-b">✧</span>
      <img src="assets/text-date-venue.png" alt="Date & Venue">
    </button>

    <button class="floating-label label-gift" data-modal="giftModal" aria-label="Buka Gift">
      <span class="pink-aura"></span><span class="spark spark-a">✦</span><span class="spark spark-b">✧</span>
      <img src="assets/text-gift.png" alt="Gift">
    </button>

    <button class="music-toggle" id="musicToggle" aria-label="Matikan musik">
      <img id="musicIcon" src="assets/music.png" alt="Musik aktif">
    </button>
    <button class="info-toggle" data-modal="infoModal" aria-label="Informasi undangan">
      <img src="assets/info.png" alt="Info">
    </button>
  </main>

  <audio id="bgMusic" preload="auto" loop></audio>

  <div class="modal-layer" id="modalLayer" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" aria-label="Tutup">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <template id="aboutTemplate">
    <div class="modal-art"><img src="assets/about-us.png" alt="About Us"></div>
    <h2 id="modalTitle">Yhola & Ardan</h2>
    <p class="lead" data-copy="aboutStory"></p>
    <div class="timeline" id="aboutTimeline"></div>
    <p class="parents"><strong>Ardan</strong><br><span data-copy="groomParents"></span></p>
    <p class="parents"><strong>Yhola</strong><br><span data-copy="brideParents"></span></p>
  </template>

  <template id="dateTemplate">
    <div class="modal-art wide"><img src="assets/date-venue.png" alt="Date & Venue"></div>
    <h2 id="modalTitle">Date & Venue</h2>
    <div class="event-card">
      <div><span class="label">Akad</span><strong data-copy="ceremony"></strong></div>
      <div><span class="label">Resepsi</span><strong data-copy="reception"></strong></div>
    </div>
    <h3 data-copy="venue"></h3>
    <p data-copy="address"></p>
    <a class="action" id="mapsLink" target="_blank" rel="noopener">Buka Google Maps</a>
  </template>

  <template id="giftTemplate">
    <div class="modal-art"><img src="assets/gift.png" alt="Gift"></div>
    <h2 id="modalTitle">Wedding Gift</h2>
    <p>Doa dan kehadiran Anda adalah hadiah terindah bagi kami.</p>
    <div class="bank-card">
      <strong data-copy="bank"></strong>
      <span data-copy="recipient"></span>
      <code id="accountNumber"></code>
      <button class="copy-btn" id="copyAccount">Salin Nomor Rekening</button>
    </div>
  </template>

  <template id="galleryTemplate">
    <div class="modal-art small"><img src="assets/gallery-button.png" alt="Gallery"></div>
    <h2 id="modalTitle">Gallery</h2>
    <div class="gallery-grid" id="galleryGrid"></div>
    <p class="muted" id="galleryEmpty">Foto gallery akan ditambahkan menyusul.</p>
  </template>

  <template id="rsvpTemplate">
    <div class="modal-art small"><div class="rsvp-badge">RSVP</div></div>
    <h2 id="modalTitle">RSVP</h2>
    <p>Silakan konfirmasi kehadiran melalui WhatsApp.</p>
    <label class="field">Nama<input id="guestName" placeholder="Nama Anda" autocomplete="name"></label>
    <div class="attendance" id="attendance">
      <button type="button" data-attend="Hadir">Saya akan hadir</button>
      <button type="button" data-attend="Tidak hadir">Saya belum bisa hadir</button>
    </div>
    <a class="action" id="rsvpLink" target="_blank" rel="noopener">Konfirmasi via WhatsApp</a>
  </template>

  <template id="infoTemplate">
    <div class="modal-art tiny"><img src="assets/info.png" alt="Info"></div>
    <h2 id="modalTitle">Untuk Anda</h2>
    <p id="personalGreeting"></p>
    <p data-copy="intro"></p>
    <div class="quote"><p data-copy="verse"></p><span data-copy="verseRef"></span></div>
    <p data-copy="closing"></p>
    <p class="signature" data-copy="inviter"></p>
  </template>

  <script src="data/undangan.js"></script>
  <script src="script.js"></script>
</body>
</html>
