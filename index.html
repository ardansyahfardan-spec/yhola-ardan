<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yhola & Ardan — Loading / Start Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:#20301f}
.stage{position:relative;width:100vw;height:100dvh;overflow:hidden}
.layer{position:absolute;inset:0}
.bg{background:radial-gradient(circle at 50% 20%,#dbe9ba 0 14%,transparent 15%),linear-gradient(#a7c29a 0 45%,#6d965c 46% 100%)}
.garden:before,.garden:after{content:"";position:absolute;bottom:-4%;width:78%;height:62%;background:
radial-gradient(ellipse at 18% 55%,#426b43 0 15%,transparent 16%),
radial-gradient(ellipse at 48% 35%,#507b4c 0 20%,transparent 21%),
radial-gradient(ellipse at 78% 58%,#385e3b 0 22%,transparent 23%);filter:blur(.2px)}
.garden:before{left:-27%}.garden:after{right:-27%;transform:scaleX(-1)}
.flower{position:absolute;width:10px;height:10px;border-radius:50%;background:#ead8ee;box-shadow:0 0 0 5px #d6b9dd55}
.flower:nth-child(1){left:12%;bottom:16%}.flower:nth-child(2){left:24%;bottom:11%}
.flower:nth-child(3){right:18%;bottom:17%}.flower:nth-child(4){right:30%;bottom:10%}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff4a8;box-shadow:0 0 14px 5px #fff4a877;animation:float 5s ease-in-out infinite}
.f1{left:18%;top:30%}.f2{left:76%;top:35%;animation-delay:1s}.f3{left:61%;top:23%;animation-delay:2s}
@keyframes float{50%{transform:translate(10px,-14px);opacity:.35}}
.butterfly{position:absolute;font-size:22px;animation:fly 8s ease-in-out infinite}.b1{left:16%;top:21%}.b2{right:15%;top:32%;animation-delay:2.5s}
@keyframes fly{50%{transform:translate(28px,-18px) rotate(5deg)}}
.loading-ui{z-index:5;display:grid;place-items:center;transition:opacity .6s}
.sign{width:min(76vw,340px);padding:28px 24px 24px;border-radius:18px;background:#8d623f;border:7px solid #67442c;box-shadow:0 16px 35px #0006;animation:sway 4.5s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.sign h2{margin:0;text-align:center;font-size:30px;letter-spacing:2px;color:#fff5dc}
.bar{height:14px;border-radius:20px;background:#eadcc0;margin-top:18px;overflow:hidden}.fill{height:100%;width:0;background:#b9d19a}
.loading-label{text-align:center;margin-top:9px;font:12px Arial;letter-spacing:3px;color:#fff5dc}
.start{z-index:4;opacity:0;transform:scale(.96);transition:opacity .9s,transform 1.1s}
.start.show{opacity:1;transform:scale(1)}
.start-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14vh 10vw}
.start-card small{font-size:18px;letter-spacing:2px;color:#fff8df}.start-card h1{margin:12px 0 0;font-size:clamp(48px,14vw,78px);line-height:.82;color:#fff8df;text-shadow:0 3px 12px #334d2c88}
.amp{font-size:30px;margin:8px 0;color:#fff2c9}.start-card p{font-style:italic;font-size:17px;margin:20px 0 26px;color:#fff8df}
.start-btn{border:0;border-radius:999px;padding:15px 36px;font-size:18px;font-weight:700;letter-spacing:2px;background:#f1dfbd;color:#67442c;box-shadow:0 7px 0 #9a7752;cursor:pointer}
.start-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #9a7752}
.main{z-index:3;opacity:0;transform:scale(1.35);transition:opacity .9s,transform 1.8s cubic-bezier(.2,.8,.2,1)}
.main.enter{opacity:1;transform:scale(1)}
.main-scene{position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,#d8e7b4 0 12%,transparent 13%),linear-gradient(#9ebd91 0 40%,#6d965c 41% 100%)}
.main-title{position:absolute;top:10%;width:100%;text-align:center;color:#fff9e7;text-shadow:0 2px 10px #29432788}
.main-title b{font-size:34px}.main-title p{font-size:15px}
</style></head>
<body><div class="stage">
<div class="layer bg"></div><div class="layer garden">
<i class="flower"></i><i class="flower"></i><i class="flower"></i><i class="flower"></i>
<i class="firefly f1"></i><i class="firefly f2"></i><i class="firefly f3"></i>
<i class="butterfly b1">🦋</i><i class="butterfly b2">🦋</i></div>
<section class="layer loading-ui" id="loading"><div class="sign"><h2>YHOLA &amp; ARDAN</h2><div class="bar"><div class="fill" id="fill"></div></div><div class="loading-label">LOADING...</div></div></section>
<section class="layer start" id="start"><div class="start-card"><small>The Wedding of</small><h1>Yhola</h1><div class="amp">&amp;</div><h1>Ardan</h1><p>A little story of us...</p><button class="start-btn" id="startBtn">▶ START</button></div></section>
<section class="layer main" id="main"><div class="main-scene"></div><div class="main-title"><b>YHOLA &amp; ARDAN</b><p>Main scene — zoom transition demo</p></div></section>
</div>
<script>
const fill=document.getElementById('fill'),loading=document.getElementById('loading'),start=document.getElementById('start'),main=document.getElementById('main'),btn=document.getElementById('startBtn');
let p=0;const timer=setInterval(()=>{p+=2;fill.style.width=p+'%';if(p>=100){clearInterval(timer);setTimeout(()=>{loading.style.opacity='0';start.classList.add('show')},350)}},45);
btn.onclick=()=>{start.classList.remove('show');main.classList.add('enter')};
</script></body></html>
