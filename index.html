<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182414">
<title>Yhola & Ardan — Undangan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="loadingScreen" class="entry-screen loading-screen" aria-label="Memuat undangan">
    <div class="garden-ground"></div>
    <div class="bush bush-left"></div><div class="bush bush-right"></div>
    <div class="entry-ambient" aria-hidden="true">
      <span class="entry-firefly ef1"></span><span class="entry-firefly ef2"></span><span class="entry-firefly ef3"></span><span class="entry-firefly ef4"></span>
      <span class="entry-butterfly eb1">🦋</span><span class="entry-butterfly eb2">🦋</span>
      <span class="lavender l1"></span><span class="lavender l2"></span><span class="lavender l3"></span>
    </div>
    <div class="hanging-sign loading-sign"><span>Yhola &amp; Ardan</span><small>THE WEDDING OF</small></div>
    <div class="loading-copy"><span>Preparing our little story</span><div class="loading-track"><i id="loadingFill"></i></div><b id="loadingPercent">0%</b></div>
  </section>

  <section id="startScreen" class="entry-screen start-screen" aria-label="Mulai undangan">
    <div class="start-garden"></div>
    <div class="start-ambient" aria-hidden="true"><span class="entry-firefly sf1"></span><span class="entry-firefly sf2"></span><span class="entry-butterfly sb1">🦋</span></div>
    <div class="start-content">
      <div class="start-eyebrow">The Wedding of</div>
      <div class="start-names"><strong>Yhola</strong><span>&amp;</span><strong>Ardan</strong></div>
      <p>A little story of us...</p>
      <button id="startButton" class="start-button">START</button>
    </div>
  </section>

  <main class="scene" aria-label="Undangan pernikahan interaktif">
    <img class="scene-bg" src="assets/BACKGROUND.png" alt="Ilustrasi taman Yhola & Ardan">

    <div class="ambient" aria-hidden="true">
      <span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span>
      <span class="firefly f4"></span><span class="firefly f5"></span><span class="firefly f6"></span>
      <span class="butterfly b1">🦋</span><span class="butterfly b2">🦋</span>
      <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>
    </div>

    <button class="hotspot gallery" data-popup="gallery" aria-label="Gallery"></button>
    <button class="hotspot about" data-popup="about" aria-label="Cerita Kami"></button>
    <button class="hotspot couple" data-popup="couple" aria-label="Yhola dan Ardan"></button>
    <button class="hotspot rsvp" data-popup="rsvp" aria-label="RSVP"></button>
    <button class="hotspot date" data-popup="date" aria-label="Date & Venue"></button>
    <button class="hotspot gift" data-popup="gift" aria-label="Gift"></button>

    <div class="floating-tools">
      <button id="infoBtn" class="tool" aria-label="Info"><img src="assets/INFO.png" alt="Info"></button>
      <button id="musicBtn" class="tool" aria-label="Musik"><img id="musicIcon" src="assets/MUSIK.png" alt="Musik menyala"></button>
    </div>

    <section class="guest-comments" id="commentsBox">
      <div class="comment-card">
        <div class="comment-head"><img class="comment-title" src="assets/UCAPAN.png" alt="Ucapan"><button id="nextComment" aria-label="Ucapan berikutnya">⌃</button></div>
        <div id="commentText" class="comment-text"></div>
        <div class="comment-actions">
          <button id="addComment" class="plus" aria-label="Tambah ucapan">＋</button>
          <button id="hideComments">Sembunyikan Ucapan</button>
        </div>
      </div>
    </section>
    <button id="showComments" class="show-comments"><img src="assets/UCAPAN.png" alt="Ucapan"></button>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <article class="modal-card">
      <button class="modal-close" aria-label="Tutup">×</button>
      <div id="modalContent"></div>
    </article>
  </div>

  <div id="commentModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <article class="modal-card small">
      <button class="modal-close" aria-label="Tutup">×</button>
      <div class="decor decor-comment"><div class="decor-placeholder">💌</div></div>
      <h2>Tulis Ucapan</h2>
      <form id="commentForm">
        <label>Nama<input id="commentAuthor" required maxlength="40" placeholder="Nama kamu"></label>
        <label>Ucapan<textarea id="commentMessage" required maxlength="180" rows="4" placeholder="Tulis doa dan ucapan..."></textarea></label>
        <button class="primary" type="submit">Kirim Ucapan</button>
      </form>
    </article>
  </div>

  <div id="toast" class="toast"></div>
  <audio id="bgMusic" preload="auto"></audio>
</div>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
